name: Olist sync

on:
  schedule:
    # A cada 4 horas (UTC). Mantém o banco atualizado e o refresh token vivo.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Backfill completo? (1 = sim, vazio = incremental)"
        required: false
        default: ""

# Evita execuções concorrentes do sync.
concurrency:
  group: olist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        env:
          BASE_URL: ${{ vars.OLIST_BASE_URL || 'https://olist-dash.vercel.app' }}
          SYNC_SECRET: ${{ secrets.OLIST_SYNC_SECRET }}
          FULL: ${{ github.event.inputs.full }}
        run: |
          set -eo pipefail
          URL="$BASE_URL/api/olist/sync"
          if [ -n "$FULL" ]; then URL="$URL?full=1"; fi
          echo "POST $URL"
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $SYNC_SECRET" -m 280 | tee /dev/stderr

      - name: Trigger ML cost sync endpoint
        env:
          BASE_URL: ${{ vars.OLIST_BASE_URL || 'https://olist-dash.vercel.app' }}
          SYNC_SECRET: ${{ secrets.OLIST_SYNC_SECRET }}
        run: |
          set -eo pipefail
          curl -fsS -X POST "$BASE_URL/api/ml/sync" -H "Authorization: Bearer $SYNC_SECRET" -m 280 | tee /dev/stderr

      - name: Trigger ML commercial catalog sync
        env:
          BASE_URL: ${{ vars.OLIST_BASE_URL || 'https://olist-dash.vercel.app' }}
          SYNC_SECRET: ${{ secrets.OLIST_SYNC_SECRET }}
        run: |
          set -eo pipefail
          for page in $(seq 1 50); do
            RESPONSE=$(curl -fsS -X POST "$BASE_URL/api/ml/commercial/sync" -H "Authorization: Bearer $SYNC_SECRET" -m 280)
            echo "$RESPONSE" | tee /dev/stderr
            if echo "$RESPONSE" | jq -e '.completed == true' >/dev/null; then exit 0; fi
          done
          echo "Sync comercial não concluiu após 50 páginas." >&2
          exit 1
